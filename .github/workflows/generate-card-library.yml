name: Generate Card Library

on:
  push:
    branches:
      - main
      - feature/card-library
    paths:
      - 'CardLibrary/generate_skins.py'
      - '.github/workflows/generate-card-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate skins
        run: python CardLibrary/generate_skins.py
      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CardLibrary/*.json CardLibrary/*.jpg CardLibrary/transit CardLibrary/payment
          if git diff --cached --quiet; then
            echo "Card library already up to date."
            exit 0
          fi
          git commit -m "feat(card-library): generate card skin assets [skip ci]"
          git push
