name: Card Library UI Check

on:
  push:
    branches:
      - feature/card-library-ui
  pull_request:
    paths:
      - "AirCardApp.swift"
      - "CardLibrary/**"
      - "CardLibrarySupport.swift"
      - "scripts/integrate_card_library.py"
      - "build.sh"
      - ".github/workflows/card-library-ui-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and bundled images
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("CardLibrary")
          manifest = json.loads((root / "manifest.json").read_text())
          cards = manifest["cards"]
          assert cards, "manifest contains no cards"
          assert len({card["id"] for card in cards}) == len(cards), "duplicate skin id"

          for card in cards:
              path = root / card["file"]
              assert path.is_file(), f"missing image: {path}"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == card["sha256"], f"sha256 mismatch: {path}"
          print(f"validated {len(cards)} card skins")
          PY

      - name: Generate integrated Swift source
        run: python3 scripts/integrate_card_library.py

      - name: Type-check Swift UI
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc \
            -sdk "$SDK" \
            -parse-as-library \
            -target arm64-apple-macosx14.0 \
            -typecheck \
            build/AirCardApp.generated.swift \
            CardLibrarySupport.swift
